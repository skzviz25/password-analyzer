<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SOC Dashboard</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; padding: 20px; }
        .grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
        .card { border: 1px solid #00ff41; padding: 20px; background: rgba(0, 255, 65, 0.05); }
        .danger { color: #ff3e3e; text-shadow: 0 0 5px #ff3e3e; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #00ff41; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <h1>SECURITY OPERATIONS CENTER // PASS-AUDIT V2</h1>
    <div class="grid">
        <div class="card">
            <h2>REMOTE ACCESS</h2>
            <div id="qrcode" style="background:white; padding:10px; display:inline-block;"></div>
            <p>Scan to Connect Node</p>
        </div>
        <div class="card">
            <h2>LIVE ANALYSIS</h2>
            <p>Intercepted: <span id="pass_preview" style="color: #888;">****</span></p>
            <p>Entropy: <span id="entropy">0</span> bits (<span id="strength">---</span>)</p>
            <p>Local Leak: <span id="local">Waiting...</span></p>
            <p>Global Breach: <span id="api">Waiting...</span></p>
            <p>Heuristic: <span id="insights">---</span></p>
            <h3>HARDWARE CRACK ESTIMATES</h3>
            <table>
                <thead><tr><th>Hardware Tier</th><th>Time</th></tr></thead>
                <tbody id="time_table"></tbody>
            </table>
        </div>
    </div>

    <script>
        var socket = io(window.location.origin, { transports: ['polling', 'websocket'] });

        window.onload = function() {
            new QRCode(document.getElementById("qrcode"), {
                text: window.location.origin + "/mobile",
                width: 180, height: 180
            });
        };

        socket.on('update_ui', function(data) {
            document.getElementById('pass_preview').innerText = data.pass_preview;
            document.getElementById('entropy').innerText = data.entropy;
            document.getElementById('strength').innerText = data.strength;
            document.getElementById('insights').innerText = data.insights.join(" | ");
            document.getElementById('local').innerHTML = data.local ? "<span class='danger'>MATCH</span>" : "CLEAN";
            document.getElementById('api').innerHTML = data.api ? "<span class='danger'>PWNED</span>" : "SAFE";

            let tableHTML = "";
            for (let hw in data.times) {
                let s = data.times[hw];
                let timeStr = s < 1 ? "< 1s" : s < 3600 ? (s/60).toFixed(1)+"m" : (s/86400).toFixed(1)+"d";
                tableHTML += `<tr><td>${hw}</td><td>${timeStr}</td></tr>`;
            }
            document.getElementById('time_table').innerHTML = tableHTML;
        });
    </script>
</body>
</html>
