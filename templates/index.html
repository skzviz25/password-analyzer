<!DOCTYPE html>
<html>
<head>
    <title>Security Dashboard</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; padding: 20px; }
        .card { border: 1px solid #00ff41; padding: 20px; margin-bottom: 20px; background: rgba(0, 255, 65, 0.05); }
        .danger { color: #ff3e3e; font-weight: bold; }
        .stats { font-size: 1.2rem; }
    </style>
</head>
<body>
    <h1>SYSTEM ANALYZER v4.0</h1>
    <div style="display: flex; gap: 30px;">
        <div class="card">
            <h3>SCAN ACCESS</h3>
            <div id="qrcode" style="background:white; padding:10px;"></div>
        </div>
        <div class="card" style="flex-grow: 1;">
            <h3>METRICS</h3>
            <div class="stats">
                <p>Entropy: <span id="entropy">0</span> bits</p>
                <p>Strength: <span id="strength">N/A</span></p>
                <p>Status: <span id="status">Waiting...</span></p>
                <p>Time to Crack (GPU): <span id="crack_time">0 seconds</span></p>
            </div>
        </div>
    </div>

    <script>
        var socket = io(window.location.origin);
        
        // Generate QR for whatever URL we are visiting (Local or Ngrok)
        new QRCode(document.getElementById("qrcode"), window.location.origin + "/mobile");

        socket.on('update_ui', function(data) {
            document.getElementById('entropy').innerText = data.entropy;
            document.getElementById('strength').innerText = data.strength;
            
            // Update Status
            let statusEl = document.getElementById('status');
            if(data.leaked) {
                statusEl.innerHTML = "<span class='danger'>⚠️ LEAKED IN DATABASE</span>";
            } else {
                statusEl.innerText = "✅ Secure (Not Leaked)";
            }

            // Update Time (using RTX 4090 time as reference)
            let s = data.crack_times["RTX 4090 (50B/s)"];
            let timeStr = s < 1 ? "< 1s" : s < 3600 ? (s/60).toFixed(1)+"m" : (s/86400).toFixed(1)+" days";
            document.getElementById('crack_time').innerText = timeStr;
        });
    </script>
</body>
</html>
