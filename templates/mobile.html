<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Input</title>
    <style>
        body { background: #111; color: #00ff41; font-family: sans-serif; text-align: center; padding: 40px; }
        input { width: 100%; padding: 15px; font-size: 1.2rem; margin-bottom: 20px; background: #222; color: white; border: 1px solid #00ff41; }
        button { width: 100%; padding: 15px; background: #00ff41; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>INPUT NODE</h2>
    <input type="password" id="pass" placeholder="Enter password...">
    <button id="btn">ANALYZE</button>
    <p id="msg" style="margin-top:20px;"></p>

    <script>
        document.getElementById('btn').addEventListener('click', () => {
            let password = document.getElementById('pass').value;
            fetch('/analyze_post', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password: password})
            })
            .then(() => { document.getElementById('msg').innerText = "Sent to Dashboard!"; });
        });
    </script>
</body>
</html>
